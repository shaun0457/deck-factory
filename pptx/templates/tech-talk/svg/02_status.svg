<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-Hant" data-pptx-page-role="content" font-family="Microsoft JhengHei">
  <rect id="status-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFEFC" />
  <g id="status-title" data-pptx-bounds="72 32 1136 100" font-weight="bold">
    <text x="72" y="70" font-size="18" fill="#E8553B">現況</text>
    <text x="72" y="110" font-size="40" fill="#191919">功能都在，難的是等待那幾分鐘</text>
  </g>
  <g id="status-list" data-pptx-bounds="72 150 560 430">
    <rect x="72" y="160" width="540" height="120" rx="16" fill="#EDF3EC" />
    <circle cx="122" cy="220" r="22" fill="#448361" />
    <text x="122" y="229" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="164" y="210" font-size="28" font-weight="bold" fill="#191919">受理 API</text>
    <text x="164" y="250" font-size="24" fill="#5F5E5B">送出、查詢、取消都完成</text>
    <rect x="72" y="300" width="540" height="120" rx="16" fill="#EDF3EC" />
    <circle cx="122" cy="360" r="22" fill="#448361" />
    <text x="122" y="369" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="164" y="350" font-size="28" font-weight="bold" fill="#191919">背景產生</text>
    <text x="164" y="390" font-size="24" fill="#5F5E5B">雲端和本機兩種儲存都能用</text>
    <rect x="72" y="440" width="540" height="120" rx="16" fill="#F1EFEA" stroke="#9B9A97" stroke-width="2" stroke-dasharray="8,4" />
    <circle cx="122" cy="500" r="22" fill="#9B9A97" />
    <text x="122" y="509" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✗</text>
    <text x="164" y="490" font-size="28" font-weight="bold" fill="#191919">公開部署</text>
    <text x="164" y="530" font-size="24" fill="#5F5E5B">沒有做，只在本機驗證</text>
  </g>
  <g id="status-wait" data-pptx-bounds="672 150 536 430">
    <rect x="672" y="160" width="536" height="400" rx="16" fill="#FBF3DB" />
    <text x="712" y="220" font-size="24" fill="#5F5E5B">產生一份報表要等</text>
    <text x="712" y="330" font-size="88" font-weight="bold" fill="#191919">約 40 秒</text>
    <text x="712" y="380" font-size="18" font-weight="bold" fill="#E8553B">情景數據 · 示意，非實測</text>
    <text x="712" y="450" font-size="24" fill="#191919">一般 API 是毫秒等級；<tspan x="712" dy="38">這段時間比它長上千倍。</tspan></text>
  </g>
  <g id="status-takeaway" data-pptx-bounds="72 596 1136 88" fill="#191919">
    <rect x="72" y="604" width="1136" height="72" rx="12" fill-opacity="0.06" />
    <text x="100" y="650" font-size="28">這段時間裡，使用者會<tspan font-weight="bold" fill="#E8553B">重送、斷線</tspan>，server 也可能<tspan font-weight="bold" fill="#E8553B">當機</tspan>。</text>
  </g>
